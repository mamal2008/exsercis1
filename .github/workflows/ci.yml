name: PYTHON CI
on: [push,pull-requests]
jobs:
  test:
    runs-on: ubuntu-latest
  steps:
  - name: checkout repo 
    uses: actions/checkout@v4
  - name: set up python 
    uses: actions/setup-python@v5
    with:
      python-version=="3.12"
  - name: install dependencies
    run: pip install -r pytest
  - name: run test  
    run: pytest